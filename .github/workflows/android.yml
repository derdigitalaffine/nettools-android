name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - name: Compile and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: nettools-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish 0.10.0-alpha GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.10.0-alpha
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" > nettools-android-v0.10.0-alpha-debug.apk.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its artifacts unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            "$apk#nettools-android-v0.10.0-alpha-debug.apk" \
            "nettools-android-v0.10.0-alpha-debug.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "NetTools Android 0.10.0-alpha" \
            --prerelease \
            --notes "Adaptive Material-3-Oberfläche mit Diagnosekatalog, Suche, Favoriten, Light/Dark-Mode, Dashboard, BLE-, GNSS-, USB- und Karten-Polish. Debug-APK, nicht produktionssigniert. Automatisiert gebaut und mit Unit-Tests geprüft; Hardware- und Accessibility-Abnahme steht noch aus."
